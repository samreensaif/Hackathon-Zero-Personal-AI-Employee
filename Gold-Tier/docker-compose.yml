version: '3.8'

services:
  db:
    image: postgres:16
    container_name: odoo_gold_tier_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_gold_tier_pwd
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:19.0
    container_name: odoo_gold_tier
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo_gold_tier_pwd
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-config:/etc/odoo
      - odoo-addons:/mnt/extra-addons
    command: >
      -- --database=odoo_gold_tier
         --db_host=db
         --db_port=5432
         --db_user=odoo
         --db_password=odoo_gold_tier_pwd
         --init=base
         --without-demo=all

volumes:
  odoo-db-data:
    driver: local
  odoo-data:
    driver: local
  odoo-config:
    driver: local
  odoo-addons:
    driver: local
